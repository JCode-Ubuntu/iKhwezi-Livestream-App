services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: ikhwezi-backend-prod
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_KEY=${ADMIN_KEY}
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
      - RTMP_SERVER=${RTMP_SERVER:-rtmp://nginx-rtmp-prod:1935/live}
      - HLS_URL=${HLS_URL:-http://localhost:8081/hls}
      # Meeting A/V (LiveKit) — all four or none; see docker-compose.yml notes.
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - LOG_LEVEL=info
    volumes:
      - backend-storage-prod:/app/storage
      - backend-logs-prod:/app/logs
    depends_on:
      - nginx-rtmp
    restart: always
    networks:
      - ikhwezi-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_URL:-http://localhost:8080}
    container_name: ikhwezi-frontend-prod
    ports:
      - "8080:80"
    depends_on:
      - backend
      - nginx-rtmp
    restart: always
    networks:
      - ikhwezi-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  nginx-rtmp:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ikhwezi-rtmp-prod
    ports:
      - "1935:1935"
      - "8081:8080"
    environment:
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
      - BACKEND_UPSTREAM=ikhwezi-backend-prod:3001
    volumes:
      - hls-storage-prod:/tmp/hls
    restart: always
    networks:
      - ikhwezi-network-prod
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1935"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Meeting A/V — same SFU as docker-compose.yml; see notes there. TLS for
  # wss:// and TURN/TLS is terminated by the site's outer reverse proxy
  # (ikhwezi.site → livekit:7880), which is how the site already fronts 8080.
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: ikhwezi-livekit-prod
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        turn:
          enabled: true
          udp_port: 3478
          domain: ikhwezi.site
        keys:
          ${LIVEKIT_API_KEY:-devplaceholderkey}: ${LIVEKIT_API_SECRET:-devplaceholdersecret-change-me}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-60000:50000-60000/udp"
    restart: always
    networks:
      - ikhwezi-network-prod

  # Optional: Reverse Proxy for SSL/TLS termination
  # Uncomment and configure for production HTTPS
  # nginx-proxy:
  #   image: nginx:alpine
  #   container_name: ikhwezi-proxy-prod
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/proxy.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl/:/etc/nginx/ssl/:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   restart: always
  #   networks:
  #     - ikhwezi-network-prod

volumes:
  backend-storage-prod:
    driver: local
  backend-logs-prod:
    driver: local
  hls-storage-prod:
    driver: local

networks:
  ikhwezi-network-prod:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ikhwezi-prod
