services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: ikhwezi-backend-prod
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_KEY=${ADMIN_KEY}
      # Phase 3A RBAC transition: ADMIN_KEY_ENABLED=false hard-disables all
      # remaining shared-key paths (bootstrap grant + ban fallback) once the
      # first admin account exists. Default true during transition.
      - ADMIN_KEY_ENABLED=${ADMIN_KEY_ENABLED:-true}
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
      # Webhook source allow-list: production keeps internal-only ON.
      - RTMP_WEBHOOK_INTERNAL_ONLY=${RTMP_WEBHOOK_INTERNAL_ONLY:-true}
      - RTMP_SERVER=${RTMP_SERVER:-rtmp://nginx-rtmp-prod:1935/live}
      - HLS_URL=${HLS_URL:-http://localhost:8081/hls}
      # ==================== DATABASE (PostgreSQL) ====================
      # Backend runs versioned migrations on boot (backend/db/migrate.js).
      # DATABASE_URL set → PostgreSQL; unset → SQLite fallback
      # (/app/storage/ikhwezi.db). Hostname `postgres` is the compose-network
      # service name. DATABASE_SSL=false: private network, no TLS needed.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ikhwezi}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-ikhwezi}
      - DATABASE_SSL=false
      # ==================== REDIS (queues / cache) ====================
      # Worker A's BullMQ wiring connects lazily via REDIS_URL and falls back
      # to an in-process queue when it is unset (dev outside compose).
      - REDIS_URL=redis://redis:6379
      # ==================== AUTOMATED ENCRYPTED BACKUPS ====================
      # backend/jobs/backupJob.js writes timestamped, integrity-verified,
      # optionally encrypted backups here on boot + every BACKUP_INTERVAL_HOURS.
      # The `backup-storage-prod` volume keeps them across container
      # replacement. BACKUP_ENCRYPTION_KEY has no default — empty = plain
      # files, named `.UNENCRYPTED` with a loud log line.
      - BACKUP_DIR=/app/storage/backups
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_KEEP=${BACKUP_KEEP:-7}
      - BACKUP_INCLUDE_MEDIA=${BACKUP_INCLUDE_MEDIA:-true}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      # Meeting A/V (LiveKit) — all four or none; see docker-compose.yml notes.
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - LOG_LEVEL=info
    volumes:
      - backend-storage-prod:/app/storage
      # Backups on their own volume: pruning old backups can never touch the
      # live DB/uploads in backend-storage-prod, and a backend-storage wipe
      # leaves backups intact.
      - backup-storage-prod:/app/storage/backups
      - backend-logs-prod:/app/logs
    depends_on:
      nginx-rtmp:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - ikhwezi-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_URL:-http://localhost:8080}
    container_name: ikhwezi-frontend-prod
    ports:
      - "8080:80"
    depends_on:
      - backend
      - nginx-rtmp
    restart: always
    networks:
      - ikhwezi-network-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==================== REDIS — queues / cache ====================
  # Same AOF-persisted Redis as docker-compose.yml; backend gates on its
  # healthcheck (condition: service_healthy above). No host port in the
  # dist file (matches postgres: private to the compose network).
  redis:
    image: redis:8-alpine
    container_name: ikhwezi-redis-prod
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: always
    networks:
      - ikhwezi-network-prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ==================== DATABASE — PostgreSQL ====================
  # Backend boot runs the versioned migrations (backend/migrations/) against
  # this instance; the backend service waits for its healthcheck
  # (condition: service_healthy above).
  postgres:
    image: postgres:16-alpine
    container_name: ikhwezi-postgres-prod
    environment:
      # POSTGRES_PASSWORD is REQUIRED (compose-level). USER/DB have safe
      # defaults matching the backend DATABASE_URL.
      - POSTGRES_USER=${POSTGRES_USER:-ikhwezi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-ikhwezi}
    volumes:
      - postgres-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ikhwezi} -d ${POSTGRES_DB:-ikhwezi}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
    networks:
      - ikhwezi-network-prod
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  nginx-rtmp:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ikhwezi-rtmp-prod
    ports:
      - "1935:1935"
      - "8081:8080"
    environment:
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
      - BACKEND_UPSTREAM=ikhwezi-backend-prod:3001
    volumes:
      - hls-storage-prod:/tmp/hls
    restart: always
    networks:
      - ikhwezi-network-prod
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1935"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Meeting A/V — same SFU as docker-compose.yml; see notes there. TLS for
  # wss:// and TURN/TLS is terminated by the site's outer reverse proxy
  # (ikhwezi.site → livekit:7880), which is how the site already fronts 8080.
  #
  # EXTERNAL TURN: see the coturn service below and the extended notes in
  # docker-compose.yml. The rtc.turn_servers block is NOT inlined here:
  # compose cannot conditionally append YAML, and an empty-host entry would
  # make livekit-server reject its config (not fail-open). dist deployments
  # activate the relay by appending the turn_servers block to LIVEKIT_CONFIG
  # at deployment (documented in .env.dist + compose notes).
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: ikhwezi-livekit-prod
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        turn:
          enabled: true
          udp_port: 3478
          domain: ikhwezi.site
        keys:
          ${LIVEKIT_API_KEY:-devplaceholderkey}: ${LIVEKIT_API_SECRET:-devplaceholdersecret-change-me}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-60000:50000-60000/udp"
    restart: always
    networks:
      - ikhwezi-network-prod

  # ==================== EXTERNAL TURN RELAY — coturn ====================
  # Same relay as docker-compose.yml — see the extended design notes there.
  # Dist differences, mirroring the redis/postgres pattern:
  #   • NO host port mapping (3478/relay range stay private to the compose
  #     network; the public path is the outer reverse proxy / firewall).
  #   • TURN_USER/TURN_SECRET are REQUIRED in this file — the dist
  #     deployment is production: a TURN relay without credentials would
  #     be an open relay, so compose refuses to start the service without
  #     them (:?err interpolation, same as POSTGRES_PASSWORD above).
  #   • rtp-range 49160-49169: relay ports must ALSO be open on the VPS
  #     firewall for external clients; widen with scale.
  # The rtc.turn_servers hand-off to LIVEKIT_CONFIG is the single remaining
  # deployment-time step — see notes in docker-compose.yml + .env.dist (an
  # inlined empty-host entry would make livekit-server reject its config,
  # which is not fail-open, so it is deliberately not inlined).
  coturn:
    image: coturn/coturn:alpine
    container_name: ikhwezi-coturn-prod
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=ikhwezi.site
      - --listening-port=3478
      - --min-port=${COTURN_RELAY_PORT_START:-49160}
      - --max-port=${COTURN_RELAY_PORT_END:-49169}
      - --user=${TURN_USER:?TURN_USER must be set in .env (or remove this service)}:${TURN_SECRET:?TURN_SECRET must be set in .env (or remove this service)}
    restart: always
    networks:
      - ikhwezi-network-prod

  # Optional: Reverse Proxy for SSL/TLS termination
  # Uncomment and configure for production HTTPS
  # nginx-proxy:
  #   image: nginx:alpine
  #   container_name: ikhwezi-proxy-prod
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/proxy.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl/:/etc/nginx/ssl/:ro
  #   depends_on:
  #     - frontend
  #     - backend
  #   restart: always
  #   networks:
  #     - ikhwezi-network-prod

volumes:
  backend-storage-prod:
    driver: local
  backend-logs-prod:
    driver: local
  hls-storage-prod:
    driver: local
  postgres-data-prod:
    driver: local
  redis-data-prod:
    driver: local
  backup-storage-prod:
    driver: local

networks:
  ikhwezi-network-prod:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-ikhwezi-prod
