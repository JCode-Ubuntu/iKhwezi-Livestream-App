services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ikhwezi-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # SECURITY: JWT_SECRET / ADMIN_KEY must NEVER be hardcoded here — this
      # file is committed to a public repo, so any literal value here is
      # public knowledge forever (even after it's replaced, it's still in
      # git history). They are read from a `.env` file placed next to this
      # docker-compose.yml on the server (gitignored, never committed) or
      # from the shell environment. Docker Compose substitutes `${VAR}`
      # from either automatically. If unset, the backend safely generates a
      # random per-process secret instead of falling back to a public value
      # (see backend/index.js requireSecretOrGenerate) — set real, stable
      # values in the server's .env so restarts don't invalidate every
      # logged-in session.
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_KEY=${ADMIN_KEY}
      # Phase 3A RBAC transition: ADMIN_KEY_ENABLED=false hard-disables all
      # remaining shared-key paths (bootstrap grant + ban fallback) once the
      # first admin account exists. Default true during transition.
      - ADMIN_KEY_ENABLED=${ADMIN_KEY_ENABLED:-true}
      # Shared secret for nginx-rtmp → backend on-publish callbacks. The
      # nginx-rtmp service below is built from ./nginx, whose entrypoint
      # renders the SAME value into nginx.conf (?secret=...), so the backend
      # can verify every callback (backend/middleware/rtmpWebhook.js).
      # Both services must receive an identical value; set it once in the
      # server's .env (e.g. `openssl rand -hex 32`). TRUST_INTERNAL_RTMP_WEBHOOK
      # is intentionally NOT set any more — the private-IP bypass is no longer
      # needed and would let any container on the bridge toggle live status.
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
      # Webhook source allow-list: only accept on_publish calls arriving from
      # the internal compose network (true). Constant-time secret compare is
      # enforced in addition; this adds the network-position defense.
      - RTMP_WEBHOOK_INTERNAL_ONLY=${RTMP_WEBHOOK_INTERNAL_ONLY:-true}
      - RTMP_SERVER=rtmp://nginx-rtmp:1935/live
      - RTMP_PUBLIC_SERVER=rtmp://ikhwezi.site:1935/live
      - HLS_HOST=https://ikhwezi.site/hls
      - HLS_URL=https://ikhwezi.site/hls
      # ==================== DATABASE (PostgreSQL) ====================
      # The backend runs migrations on boot (backend/db/migrate.js). With
      # DATABASE_URL set it uses PostgreSQL; left empty it falls back to
      # SQLite at /app/storage/ikhwezi.db (local dev without postgres).
      # Hostname `postgres` resolves on the compose network only.
      # DATABASE_SSL=false: the connection is inside the private compose
      # network, so TLS is unnecessary (would fail without certs anyway).
      # Safe dev default password — CHANGE IT in your .env for anything
      # beyond a local machine (this repo is public).
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ikhwezi}:${POSTGRES_PASSWORD:-ikhwezi-dev-password-change-me}@postgres:5432/${POSTGRES_DB:-ikhwezi}
      - DATABASE_SSL=false
      # ==================== REDIS (queues / cache) ====================
      # Worker A's BullMQ wiring reads REDIS_URL lazily and falls back to an
      # in-process queue when it is unset — passing it here simply makes the
      # compose Redis reachable. Outside compose (bare `npm run dev`), leave
      # REDIS_URL unset and no Redis is needed.
      - REDIS_URL=redis://redis:6379
      # ==================== AUTOMATED ENCRYPTED BACKUPS ====================
      # backend/jobs/backupJob.js writes timestamped, integrity-verified,
      # optionally encrypted backups here on boot + every BACKUP_INTERVAL_HOURS.
      # The `backup-storage` volume (backend volumes below) makes them survive
      # container replacement. BACKUP_ENCRYPTION_KEY is deliberately NOT given
      # a default here — an empty value means plain (unencrypted) files, which
      # the job names `.UNENCRYPTED` and logs loudly. Set it via .env.
      - BACKUP_DIR=/app/storage/backups
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_KEEP=${BACKUP_KEEP:-7}
      - BACKUP_INCLUDE_MEDIA=${BACKUP_INCLUDE_MEDIA:-true}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      # ==================== MEETING A/V (LiveKit SFU) ====================
      # When all four are set, meetings get real audio/video (tokens are
      # minted server-side after membership+live checks; capabilities report
      # A/V as available). When ANY is missing, the app degrades to
      # presence-only meetings and the token route answers 501 — the honest,
      # stable behaviour. LIVEKIT_URL is the backend→SFU REST address
      # (docker service name is fine); LIVEKIT_PUBLIC_URL is the address the
      # web/native client connects to (wss:// via the frontend nginx
      # /livekit proxy, or wss://livekit.your-domain for direct DNS setups).
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      # ==================== PAYMENTS (Stripe) ====================
      # Wallet coin top-ups: both set → real Stripe Checkout; either unset →
      # top-up disabled in production (503), free instant grant in dev (see
      # backend/index.js /api/wallet/topup + PAYMENTS section in .env.dist).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Public site URL for Stripe checkout success/cancel redirects; the
      # backend falls back to http://localhost:5173 when unset.
      - FRONTEND_URL=${FRONTEND_URL:-}
      # ==================== OBJECT STORAGE (S3 / R2) ====================
      # Background upload copy + off-site backup target, fail-open (uploads
      # never fail because of these). Bucket + keys set → S3/R2 driver,
      # empty → local-disk driver (default). S3_ENDPOINT is required for
      # Cloudflare R2/MinIO; leave empty for real AWS.
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      # Public URL base for publicUrl() (CDN/bucket). STORAGE_PUBLIC_URL
      # takes precedence; S3_PUBLIC_URL is the legacy alias.
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      # ==================== ERROR MONITORING (Sentry) ====================
      # Unset DSN → no-op hub. A DSN only takes effect when @sentry/node is
      # npm-installed (otherwise a loud warning is logged at first use).
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    volumes:
      - backend-storage:/app/storage
      # Backups are on their own volume so a `backup-storage` prune is
      # surgical and never touches the live DB/uploads in backend-storage.
      - backup-storage:/app/storage/backups
    depends_on:
      - nginx-rtmp
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - ikhwezi-network

  # ==================== REDIS — queues / cache ====================
  # Single-instance, AOF-persisted Redis for the backend's queue/cache layer
  # (worker A's BullMQ wiring connects lazily via REDIS_URL on the backend
  # service and falls back to an in-process queue when REDIS_URL is not set,
  # so this service is safe to start but also optional at runtime).
  # Port exposed on the host in the DEV file only (for redis-cli inspection);
  # 6379 was free on this Windows dev host — override via .env REDIS_HOST_PORT.
  redis:
    image: redis:8-alpine
    container_name: ikhwezi-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - ikhwezi-network

  # ==================== DATABASE — PostgreSQL ====================
  # Managed-by-compose Postgres for the backend. The backend container runs
  # versioned migrations (backend/migrations/) on boot; DELETE the volume
  # and it rebuilds cleanly on Postgres like it does on SQLite.
  # Post 5432 is exposed on the host in the DEV file only (for
  # psql/pgAdmin/local smoke tests); the dist file keeps it private.
  postgres:
    image: postgres:16-alpine
    container_name: ikhwezi-postgres
    environment:
      # Safe dev defaults; override via .env. Set real credentials
      # anywhere beyond a local machine (this repo is public).
      - POSTGRES_USER=${POSTGRES_USER:-ikhwezi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ikhwezi-dev-password-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-ikhwezi}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ikhwezi} -d ${POSTGRES_DB:-ikhwezi}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - ikhwezi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ikhwezi-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      - nginx-rtmp
    restart: unless-stopped
    networks:
      - ikhwezi-network

  nginx-rtmp:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ikhwezi-rtmp
    ports:
      - "1935:1935"
      - "8081:8080"
    environment:
      # Must match the backend's RTMP_WEBHOOK_SECRET exactly (see above).
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
    volumes:
      - hls-storage:/tmp/hls
    restart: unless-stopped
    networks:
      - ikhwezi-network

  # ==================== MEETING A/V — LiveKit SFU ====================
  # Self-hosted selective forwarding unit + embedded TURN (UDP) for group
  # meeting calls. Entry is token-gated by the backend (POST
  # /api/meetings/:id/media-token → membership + live-status checks); the SFU
  # accepts no other form of client. Ports must be open on the VPS firewall
  # (Lightsail networking): TCP 7880/7881 + UDP 3478 and 50000-60000.
  #
  # The full config is passed inline via LIVEKIT_CONFIG (livekit-server reads
  # that env var directly — no file mount). keys: MUST equal the backend's
  # LIVEKIT_API_KEY / LIVEKIT_API_SECRET from .env, so every minted token
  # validates. Until the operator sets real values in .env, a placeholder pair
  # keeps the container bootable but the backend stays unconfigured → the app
  # degrades to presence-only meetings (token route 501, capabilities false).
  #
  # EXTERNAL TURN (coturn service below): livekit-server embeds any
  # rtc.turn_servers entries into every client's JoinResponse ice_servers
  # (verified from livekit pkg/config/config.go TURNServer{host, port,
  # protocol, username, credential} + livekit.proto JoinResponse).
  # Compose interpolation cannot CONDITIONALLY append that YAML block, and
  # an always-on entry with empty host would make livekit-server reject its
  # config (not fail-open) — so it is deliberately NOT wired inline here.
  # See the coturn service notes for the single remaining operator step.
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: ikhwezi-livekit
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: ${LIVEKIT_RTC_PORT_START:-50000}
          port_range_end: ${LIVEKIT_RTC_PORT_END:-60000}
          use_external_ip: true
        turn:
          enabled: true
          udp_port: 3478
          domain: ikhwezi.site
        keys:
          ${LIVEKIT_API_KEY:-devplaceholderkey}: ${LIVEKIT_API_SECRET:-devplaceholdersecret-change-me}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      # RTC media relay range — parameterized so hosts with Windows/Hyper-V
      # excluded port ranges can remap (defaults match production behavior).
      - "${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-60000}:${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-60000}/udp"
    restart: unless-stopped
    networks:
      - ikhwezi-network

  # ==================== EXTERNAL TURN RELAY — coturn ====================
  # WHY: LiveKit's EMBEDDED turn (above) only covers the UDP/3478 + TLS-domain
  # path; clients behind hostile NATs (mobile carriers, strict hotel/company
  # firewalls) often need a full TURN relay with static credentials to get
  # meeting media through at all. LiveKit server, when handed
  # rtc.turn_servers (host/port/protocol/username/credential), embeds the
  # TURN endpoint into every client's signaling JoinResponse ice_servers —
  # the web/native frontend needs ZERO changes (shape verified against
  # livekit pkg/config/config.go TURNServer + livekit.proto JoinResponse).
  #
  # WIRING (the single remaining operator step): compose interpolation
  # cannot conditionally append a YAML block, so the turn_servers entry in
  # LIVEKIT_CONFIG (livekit service above) is NOT included here — an empty
  # host string would make livekit-server reject the whole config and take
  # meetings down (not fail-open). To activate the relay for clients, add
  # to LIVEKIT_CONFIG in .env-style deployment:
  #     rtc:
  #       turn_servers:
  #         - host: <host clients can reach>   # e.g. ikhwezi.site
  #           port: ${COTURN_PORT:-3478}
  #           protocol: udp
  #           username: ${TURN_USER}
  #           credential: ${TURN_SECRET}
  #   ...merged with this file's base config. Until that block is added,
  #   coturn runs but LiveKit does not hand it to clients — meetings behave
  #   exactly as today (honest, fail-open).
  #
  # AUTH: --lt-cred-mech with static TURN_USER/TURN_SECRET from .env —
  # coturn-over-UDP with static creds needs no domain and no TLS, so it is
  # fully functional TODAY. (tls-listener/5349 is the documented future
  # step: it requires the owner's domain + certificate, which this public
  # repo cannot ship.)
  #
  # RELAY PORTS: 49160-49169 UDP — deliberately SMALL. Each relayed PEER
  # eats one port per allocation (typically 2 allocations per
  # participant: audio+video); ~10 ports ≈ a handful of NATed
  # participants. WIDEN THE RANGE with scale and keep the firewall +
  # ports: list in sync (COTURN_RELAY_PORT_START/END).
  #
  # FAIL-OPEN: with TURN_USER/TURN_SECRET unset, coturn still boots with
  # --lt-cred-mech and simply authenticates nobody (it idles); no other
  # service depends on it. Meetings cannot break because of it.
  coturn:
    image: coturn/coturn:alpine
    container_name: ikhwezi-coturn
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=ikhwezi.site
      - --listening-port=3478
      - --min-port=${COTURN_RELAY_PORT_START:-49160}
      - --max-port=${COTURN_RELAY_PORT_END:-49169}
    # NOTE: --user cannot be conditionally appended (compose interpolation
    # has no ${VAR:+...} form). When TURN_USER/TURN_SECRET are set, the
    # operator appends them via .env merging or docker-compose.override.yml
    # (documented in .env.dist). Without --user, --lt-cred-mech + empty
    # userdb = nobody can authenticate — the fail-open idle state.
    ports:
      # Dev file maps to the host for native Android emulator/device tests
      # following the existing REDIS_HOST_PORT pattern; host 3479 avoids
      # colliding with the livekit container's 3478 mapping above.
      - "${COTURN_HOST_PORT:-3479}:3478/udp"
      - "${COTURN_HOST_PORT:-3479}:3478/tcp"
      - "49160-49169:49160-49169/udp"
    restart: unless-stopped
    networks:
      - ikhwezi-network

volumes:
  backend-storage:
  hls-storage:
  postgres-data:
  redis-data:
  backup-storage:

networks:
  ikhwezi-network:
    driver: bridge
