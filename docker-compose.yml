services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ikhwezi-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # SECURITY: JWT_SECRET / ADMIN_KEY must NEVER be hardcoded here — this
      # file is committed to a public repo, so any literal value here is
      # public knowledge forever (even after it's replaced, it's still in
      # git history). They are read from a `.env` file placed next to this
      # docker-compose.yml on the server (gitignored, never committed) or
      # from the shell environment. Docker Compose substitutes `${VAR}`
      # from either automatically. If unset, the backend safely generates a
      # random per-process secret instead of falling back to a public value
      # (see backend/index.js requireSecretOrGenerate) — set real, stable
      # values in the server's .env so restarts don't invalidate every
      # logged-in session.
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_KEY=${ADMIN_KEY}
      # Shared secret for nginx-rtmp → backend on-publish callbacks. The
      # nginx-rtmp service below is built from ./nginx, whose entrypoint
      # renders the SAME value into nginx.conf (?secret=...), so the backend
      # can verify every callback (backend/middleware/rtmpWebhook.js).
      # Both services must receive an identical value; set it once in the
      # server's .env (e.g. `openssl rand -hex 32`). TRUST_INTERNAL_RTMP_WEBHOOK
      # is intentionally NOT set any more — the private-IP bypass is no longer
      # needed and would let any container on the bridge toggle live status.
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
      - RTMP_SERVER=rtmp://nginx-rtmp:1935/live
      - RTMP_PUBLIC_SERVER=rtmp://ikhwezi.site:1935/live
      - HLS_HOST=https://ikhwezi.site/hls
      - HLS_URL=https://ikhwezi.site/hls
      # ==================== DATABASE (PostgreSQL) ====================
      # The backend runs migrations on boot (backend/db/migrate.js). With
      # DATABASE_URL set it uses PostgreSQL; left empty it falls back to
      # SQLite at /app/storage/ikhwezi.db (local dev without postgres).
      # Hostname `postgres` resolves on the compose network only.
      # DATABASE_SSL=false: the connection is inside the private compose
      # network, so TLS is unnecessary (would fail without certs anyway).
      # Safe dev default password — CHANGE IT in your .env for anything
      # beyond a local machine (this repo is public).
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ikhwezi}:${POSTGRES_PASSWORD:-ikhwezi-dev-password-change-me}@postgres:5432/${POSTGRES_DB:-ikhwezi}
      - DATABASE_SSL=false
      # ==================== MEETING A/V (LiveKit SFU) ====================
      # When all four are set, meetings get real audio/video (tokens are
      # minted server-side after membership+live checks; capabilities report
      # A/V as available). When ANY is missing, the app degrades to
      # presence-only meetings and the token route answers 501 — the honest,
      # stable behaviour. LIVEKIT_URL is the backend→SFU REST address
      # (docker service name is fine); LIVEKIT_PUBLIC_URL is the address the
      # web/native client connects to (wss:// via the frontend nginx
      # /livekit proxy, or wss://livekit.your-domain for direct DNS setups).
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    volumes:
      - backend-storage:/app/storage
    depends_on:
      - nginx-rtmp
      - postgres
    restart: unless-stopped
    networks:
      - ikhwezi-network

  # ==================== DATABASE — PostgreSQL ====================
  # Managed-by-compose Postgres for the backend. The backend container runs
  # versioned migrations (backend/migrations/) on boot; DELETE the volume
  # and it rebuilds cleanly on Postgres like it does on SQLite.
  # Post 5432 is exposed on the host in the DEV file only (for
  # psql/pgAdmin/local smoke tests); the dist file keeps it private.
  postgres:
    image: postgres:16-alpine
    container_name: ikhwezi-postgres
    environment:
      # Safe dev defaults; override via .env. Set real credentials
      # anywhere beyond a local machine (this repo is public).
      - POSTGRES_USER=${POSTGRES_USER:-ikhwezi}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ikhwezi-dev-password-change-me}
      - POSTGRES_DB=${POSTGRES_DB:-ikhwezi}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ikhwezi} -d ${POSTGRES_DB:-ikhwezi}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - ikhwezi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ikhwezi-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      - nginx-rtmp
    restart: unless-stopped
    networks:
      - ikhwezi-network

  nginx-rtmp:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ikhwezi-rtmp
    ports:
      - "1935:1935"
      - "8081:8080"
    environment:
      # Must match the backend's RTMP_WEBHOOK_SECRET exactly (see above).
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
    volumes:
      - hls-storage:/tmp/hls
    restart: unless-stopped
    networks:
      - ikhwezi-network

  # ==================== MEETING A/V — LiveKit SFU ====================
  # Self-hosted selective forwarding unit + embedded TURN (UDP) for group
  # meeting calls. Entry is token-gated by the backend (POST
  # /api/meetings/:id/media-token → membership + live-status checks); the SFU
  # accepts no other form of client. Ports must be open on the VPS firewall
  # (Lightsail networking): TCP 7880/7881 + UDP 3478 and 50000-60000.
  #
  # The full config is passed inline via LIVEKIT_CONFIG (livekit-server reads
  # that env var directly — no file mount). keys: MUST equal the backend's
  # LIVEKIT_API_KEY / LIVEKIT_API_SECRET from .env, so every minted token
  # validates. Until the operator sets real values in .env, a placeholder pair
  # keeps the container bootable but the backend stays unconfigured → the app
  # degrades to presence-only meetings (token route 501, capabilities false).
  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: ikhwezi-livekit
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        turn:
          enabled: true
          udp_port: 3478
          domain: ikhwezi.site
        keys:
          ${LIVEKIT_API_KEY:-devplaceholderkey}: ${LIVEKIT_API_SECRET:-devplaceholdersecret-change-me}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-60000:50000-60000/udp"
    restart: unless-stopped
    networks:
      - ikhwezi-network

volumes:
  backend-storage:
  hls-storage:
  postgres-data:

networks:
  ikhwezi-network:
    driver: bridge
