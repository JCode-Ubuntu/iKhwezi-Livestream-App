services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ikhwezi-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # SECURITY: JWT_SECRET / ADMIN_KEY must NEVER be hardcoded here — this
      # file is committed to a public repo, so any literal value here is
      # public knowledge forever (even after it's replaced, it's still in
      # git history). They are read from a `.env` file placed next to this
      # docker-compose.yml on the server (gitignored, never committed) or
      # from the shell environment. Docker Compose substitutes `${VAR}`
      # from either automatically. If unset, the backend safely generates a
      # random per-process secret instead of falling back to a public value
      # (see backend/index.js requireSecretOrGenerate) — set real, stable
      # values in the server's .env so restarts don't invalidate every
      # logged-in session.
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_KEY=${ADMIN_KEY}
      # Shared secret for nginx-rtmp → backend on-publish callbacks. The
      # nginx-rtmp service below is built from ./nginx, whose entrypoint
      # renders the SAME value into nginx.conf (?secret=...), so the backend
      # can verify every callback (backend/middleware/rtmpWebhook.js).
      # Both services must receive an identical value; set it once in the
      # server's .env (e.g. `openssl rand -hex 32`). TRUST_INTERNAL_RTMP_WEBHOOK
      # is intentionally NOT set any more — the private-IP bypass is no longer
      # needed and would let any container on the bridge toggle live status.
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
      - RTMP_SERVER=rtmp://nginx-rtmp:1935/live
      - RTMP_PUBLIC_SERVER=rtmp://ikhwezi.site:1935/live
      - HLS_HOST=https://ikhwezi.site/hls
      - HLS_URL=https://ikhwezi.site/hls
    volumes:
      - backend-storage:/app/storage
    depends_on:
      - nginx-rtmp
    restart: unless-stopped
    networks:
      - ikhwezi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ikhwezi-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
      - nginx-rtmp
    restart: unless-stopped
    networks:
      - ikhwezi-network

  nginx-rtmp:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ikhwezi-rtmp
    ports:
      - "1935:1935"
      - "8081:8080"
    environment:
      # Must match the backend's RTMP_WEBHOOK_SECRET exactly (see above).
      - RTMP_WEBHOOK_SECRET=${RTMP_WEBHOOK_SECRET:?RTMP_WEBHOOK_SECRET must be set in .env}
    volumes:
      - hls-storage:/tmp/hls
    restart: unless-stopped
    networks:
      - ikhwezi-network

volumes:
  backend-storage:
  hls-storage:

networks:
  ikhwezi-network:
    driver: bridge
