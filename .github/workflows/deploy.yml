name: Deploy to Lightsail

# ── ARCHITECTURE (incident 2026-09-17, second occurrence) ──────────────────
# Building images ON the Lightsail instance wedged its docker daemon twice
# (OOM-style: parallel builds first, then even serialized builds + up during
# the livekit step). A 2GB host cannot build three images reliably.
#
# NEW MODEL: GitHub Actions builds ALL images on the runner (16GB), ships
# them as compressed tarballs over SSH, and the server only runs
# `docker load` + `docker compose up -d`. The server never builds again —
# the entire OOM/wedge failure class is eliminated. Deploy cost: a ~1-2 min
# image upload instead of a ~20 min on-server build.

on:
  push:
    branches:
      - master
  workflow_dispatch:

# One deploy at a time: an in-flight deploy finishes (killing it mid-SSH
# would leave the server half-deployed), and any queued runs collapse to
# only the most recent — stale deploys never run.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gate (backend tests, frontend tests & build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Disposable Postgres for backend/test/postgres.integration.test.js
    # (forensic audit remediation Phase 9). Suite skips cleanly when
    # PG_TEST_URL is unset (local default); CI always provides it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ikhwezi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ── Backend: install → test ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/ikhwezi_test
        run: npm test

      # ── Frontend: install → test → build ───────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  images:
    name: Build & export images (on the runner — never on the server)
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Immutable release identity: every image is tagged with the commit SHA
      # (plus :latest for compose). SHA tags make rollback exact — the server
      # keeps the previous release's tarballs and can `docker load` them again
      # (rollback.yml re-runs this job for a known-good SHA).
      # Runner-side builds mirror exactly what the server used to do (same
      # Dockerfiles, same --no-cache semantics via fresh runners).
      - name: Build nginx-rtmp image
        run: |
          SHA_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build -t ikhwezi-nginx-rtmp:latest -t ikhwezi-nginx-rtmp:$SHA_TAG ./nginx

      - name: Build backend image
        run: |
          SHA_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build -t ikhwezi-backend:latest -t ikhwezi-backend:$SHA_TAG ./backend

      - name: Build frontend image
        run: |
          SHA_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          docker build -t ikhwezi-frontend:latest -t ikhwezi-frontend:$SHA_TAG ./frontend

      # Export as gzipped tarballs for the SSH transfer. gzip drops the
      # backend image (~200MB) to a fraction of its size.
      - name: Export images
        run: |
          mkdir -p deploy-artifacts
          SHA_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          docker save ikhwezi-nginx-rtmp:latest ikhwezi-nginx-rtmp:$SHA_TAG | gzip > deploy-artifacts/nginx-rtmp.tar.gz
          docker save ikhwezi-backend:latest    ikhwezi-backend:$SHA_TAG    | gzip > deploy-artifacts/backend.tar.gz
          docker save ikhwezi-frontend:latest   ikhwezi-frontend:$SHA_TAG   | gzip > deploy-artifacts/frontend.tar.gz
          ls -lh deploy-artifacts/

      - name: Upload image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: deploy-artifacts/*.tar.gz
          retention-days: 1
          compression-level: 0

  deploy:
    name: SSH Deploy (load prebuilt images — server builds nothing)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download image artifacts
        uses: actions/download-artifact@v4
        with:
          name: images
          path: deploy-artifacts

      # Ship the image tarballs first (scp), so the SSH deploy step is short.
      - name: Upload images to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          source: "deploy-artifacts/*.tar.gz"
          target: ~/ikhwezi-deploy/
          strip_components: 1
          timeout: 600s

      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          command_timeout: 20m
          # Secrets are forwarded so the remote script can sync them into the
          # server's .env (single source of truth for compose interpolation).
          envs: LIVEKIT_API_KEY,LIVEKIT_API_SECRET,S3_BUCKET,S3_ACCESS_KEY_ID,S3_SECRET_ACCESS_KEY,S3_REGION,S3_ENDPOINT,S3_PUBLIC_URL,PAYFAST_MERCHANT_ID,PAYFAST_MERCHANT_KEY,PAYFAST_PASSPHRASE,PAYFAST_ZAR_PER_USD,PAYFAST_MODE
          script: |
            set -e
            export COMPOSE_HTTP_TIMEOUT=300
            APP_DIR="$HOME/iKhwezi-Livestream-App"
            REPO="https://github.com/JCode-Ubuntu/iKhwezi-Livestream-App.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin master
            git reset --hard origin/master

            # ── Sync operator-managed secrets into the server .env ──
            # Idempotent + non-destructive: only values actually provided via
            # GitHub secrets are written; everything else on the server keeps
            # whatever the operator configured. Compose re-reads .env on every
            # `up -d`, so changed values recreate just the affected containers.
            ENV_FILE="$APP_DIR/.env"
            touch "$ENV_FILE"
            sync_env() {
              key="$1"; val="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
              else
                printf '%s=%s\n' "$key" "$val" >> "$ENV_FILE"
              fi
            }
            # LiveKit (self-hosted SFU): real keys activate token minting. The
            # livekit container's `keys:` block reads the SAME vars from this
            # file, so backend and SFU always agree.
            if [ -n "$LIVEKIT_API_KEY" ] && [ -n "$LIVEKIT_API_SECRET" ]; then
              sync_env LIVEKIT_API_KEY "$LIVEKIT_API_KEY"
              sync_env LIVEKIT_API_SECRET "$LIVEKIT_API_SECRET"
              echo "livekit credentials synced"
            fi
            # S3 / R2 object storage (set S3_* secrets to activate; see
            # docs/ops/s3-activation-checklist.md).
            if [ -n "$S3_BUCKET" ] && [ -n "$S3_ACCESS_KEY_ID" ] && [ -n "$S3_SECRET_ACCESS_KEY" ]; then
              sync_env S3_BUCKET "$S3_BUCKET"
              sync_env S3_ACCESS_KEY_ID "$S3_ACCESS_KEY_ID"
              sync_env S3_SECRET_ACCESS_KEY "$S3_SECRET_ACCESS_KEY"
              if [ -n "$S3_REGION" ]; then sync_env S3_REGION "$S3_REGION"; fi
              if [ -n "$S3_ENDPOINT" ]; then sync_env S3_ENDPOINT "$S3_ENDPOINT"; fi
              if [ -n "$S3_PUBLIC_URL" ]; then sync_env S3_PUBLIC_URL "$S3_PUBLIC_URL"; fi
              echo "s3 storage credentials synced"
            fi
            # PayFast (production payment provider; see
            # docs/ops/payment-gateway-activation.md).
            if [ -n "$PAYFAST_MERCHANT_ID" ] && [ -n "$PAYFAST_MERCHANT_KEY" ] && [ -n "$PAYFAST_PASSPHRASE" ]; then
              sync_env PAYFAST_MERCHANT_ID "$PAYFAST_MERCHANT_ID"
              sync_env PAYFAST_MERCHANT_KEY "$PAYFAST_MERCHANT_KEY"
              sync_env PAYFAST_PASSPHRASE "$PAYFAST_PASSPHRASE"
              if [ -n "$PAYFAST_ZAR_PER_USD" ]; then sync_env PAYFAST_ZAR_PER_USD "$PAYFAST_ZAR_PER_USD"; fi
              if [ -n "$PAYFAST_MODE" ]; then sync_env PAYFAST_MODE "$PAYFAST_MODE"; fi
              echo "payfast credentials synced"
            fi
            # Sentry release metadata: tag every error with the exact deployed
            # commit (forensic audit remediation, Phase 14) so errors are
            # attributable to a release. DSN itself stays operator-managed.
            sync_env SENTRY_RELEASE "$(git rev-parse HEAD)"

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            # ── Load prebuilt images (no build on this host, ever) ──
            gunzip -c ~/ikhwezi-deploy/nginx-rtmp.tar.gz | docker load
            gunzip -c ~/ikhwezi-deploy/backend.tar.gz    | docker load
            gunzip -c ~/ikhwezi-deploy/frontend.tar.gz   | docker load

            # Free published ports before recreate. Port 3001 has repeatedly
            # been LISTEN with backend stuck in "Created" and no owner in
            # `docker ps` — a docker-proxy/libnetwork ghost. fuser alone does
            # not clear Docker's port map; restarting dockerd does (data
            # volumes for postgres/redis survive).
            echo "=== pre-up port holders ==="
            docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}\t{{.Status}}' || true
            (ss -ltnp 2>/dev/null || true) | grep -E ':3001|:3002' || true

            for pattern in ikhwezi-backend ikhwezi-frontend ikhwezi-rtmp backend-debug livekit; do
              ids=$(docker ps -aq --filter "name=${pattern}" 2>/dev/null || true)
              if [ -n "$ids" ]; then docker rm -f $ids || true; fi
            done

            echo "restarting docker to clear stale port allocations"
            sudo systemctl restart docker
            for i in $(seq 1 40); do
              docker info >/dev/null 2>&1 && break
              sleep 2
            done
            $COMPOSE up -d postgres redis
            # Wait briefly for DB/redis health before app containers.
            sleep 8

            # nginx-rtmp renders the RTMP webhook secret into nginx.conf at
            # start, so it is recreated alongside the app services.
            $COMPOSE up -d --remove-orphans frontend backend nginx-rtmp

            # LiveKit SFU is intentionally NOT started on the 2GB Lightsail
            # host (incidents 2026-09-17 / 2026-09-18): `compose up livekit`
            # + prune wedged dockerd / userland even under `timeout`, leaving
            # ports accepting TCP with no HTTP. Meetings degrade to
            # presence-only until the instance is upsized. Keep any prior
            # livekit container stopped so it cannot reclaim RAM mid-deploy.
            timeout 30 $COMPOSE stop livekit 2>/dev/null || true
            echo "livekit SFU skipped on this host (meetings stay presence-only)"

            # ── Observable truth: the deploy is only successful if the app is
            # genuinely READY — /api/ready gates on database + redis + storage
            # (liveness alone would green-light a degraded deployment; forensic
            # audit 2026-09-17, Phase 4). Retries cover container start-up.
            echo "waiting for app to be READY..."
            ok=""
            for i in $(seq 1 45); do
              # Prefer local probe first — avoids depending on public TLS while
              # containers are still settling after recreate.
              if curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:3002/api/ready" | grep -q '^200$'; then
                ok="ready-local"; break
              fi
              if curl -sk -o /dev/null -w '%{http_code}' --max-time 5 "https://ikhwezi.site/api/ready" | grep -q '^200$'; then
                ok="ready"; break
              fi
              sleep 4
            done
            if [ -z "$ok" ]; then
              echo "ERROR: app did not become READY after deploy (dependencies failing?)"
              curl -s --max-time 5 "http://localhost:3002/api/health/dependencies" || true
              $COMPOSE ps || true
              exit 1
            fi

            # ── Release retention (rollback path, forensic audit Phase 13) ──
            # Rotated ONLY after the readiness gate passed: a failed deploy
            # leaves the previous known-good release artifacts untouched, so
            # rollback.yml can always restore the last healthy release.
            RELEASE_DIR="$HOME/ikhwezi-releases"
            mkdir -p "$RELEASE_DIR"
            rm -f "$RELEASE_DIR"/previous-*.tar.gz
            for f in nginx-rtmp backend frontend; do
              cp ~/ikhwezi-deploy/$f.tar.gz "$RELEASE_DIR/previous-$f.tar.gz"
            done
            git rev-parse HEAD > "$RELEASE_DIR/previous-release.sha"
            rm -f ~/ikhwezi-deploy/*.tar.gz

            echo "✅ Deployed $(git rev-parse --short HEAD) at $(date) (readiness: $ok)"
