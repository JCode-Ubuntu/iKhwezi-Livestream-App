name: Deploy to Lightsail

on:
  push:
    branches:
      - master
  workflow_dispatch:

# One deploy at a time: an in-flight deploy finishes (killing it mid-SSH
# would leave the server half-deployed), and any queued runs collapse to
# only the most recent — stale deploys never run.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gate (backend tests, frontend tests & build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Backend: install → test ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      # ── Frontend: install → test → build ───────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: SSH Deploy
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -e
            export COMPOSE_HTTP_TIMEOUT=300
            APP_DIR="$HOME/iKhwezi-Livestream-App"
            REPO="https://github.com/JCode-Ubuntu/iKhwezi-Livestream-App.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin master
            git reset --hard origin/master

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            # nginx-rtmp is built from ./nginx (renders the RTMP webhook
            # secret into nginx.conf at start), so it must be rebuilt and
            # recreated alongside the app services.
            # Builds run SEQUENTIALLY (one image at a time): parallel
            # --no-cache builds of three images on a small instance caused
            # an OOM-style docker daemon wedge (incident 2026-09-17).
            $COMPOSE build --no-cache nginx-rtmp
            $COMPOSE build --no-cache backend
            $COMPOSE build --no-cache frontend
            $COMPOSE up -d frontend backend nginx-rtmp

            # Meeting A/V SFU (prebuilt image — no build cost). Boot order
            # does not matter to the app: the backend tolerates a missing/
            # unreachable SFU and meetings degrade to presence-only.
            # LIVEKIT_* values in .env decide whether the backend mints
            # tokens at all.
            $COMPOSE up -d livekit || echo "WARN: livekit SFU failed to start; meetings stay presence-only"
            docker image prune -f
            echo "✅ Deployed $(git rev-parse --short HEAD) at $(date)"
