name: Deploy to Lightsail

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -e
            APP_DIR="$HOME/iKhwezi-Livestream-App"
            REPO="https://github.com/JCode-Ubuntu/iKhwezi-Livestream-App.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin master
            git reset --hard origin/master

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            # nginx-rtmp is now built from ./nginx (renders the RTMP webhook
            # secret into nginx.conf at start), so it must be rebuilt and
            # recreated alongside the app services.
            $COMPOSE build --no-cache frontend backend nginx-rtmp
            $COMPOSE up -d --force-recreate frontend backend nginx-rtmp

            # Meeting A/V SFU (prebuilt image). Boot order does not matter to
            # the app: the backend tolerates a missing/unreachable SFU and the
            # meetings degrade to presence-only. LIVEKIT_* values in .env decide
            # whether the backend mints tokens at all.
            $COMPOSE up -d livekit || echo "WARN: livekit SFU failed to start; meetings stay presence-only"
            docker image prune -f
            echo "✅ Deployed $(git rev-parse --short HEAD) at $(date)"
