version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ikhwezi
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: ikhwezi
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:6
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://ikhwezi:strongpassword@db:5432/ikhwezi
      - REDIS_URL=redis://redis:6379
      - PORT=3101
    depends_on:
      - db
      - redis
    ports:
      - "3101:3101"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend

volumes:
  db-data:
