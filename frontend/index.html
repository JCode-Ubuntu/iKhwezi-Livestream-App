<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iKHWEZI" />
    <meta name="description" content="iKHWEZI Ultima — Stream the night. Shine the signal." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600;700;800;900&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <title>iKHWEZI Ultima</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        width: 100%;
        /* `100%`/`100vh` on mobile browsers is based on the *largest* viewport
           (address bar collapsed), so content sits behind the address bar when
           it's expanded. `100dvh` tracks the real, current visible viewport.
           The `100%` line stays first as a fallback for browsers that don't
           support `dvh` — an unsupported value invalidates only that one
           declaration, not the whole rule. */
        height: 100%;
        height: 100dvh;
        background: #030014;
        font-family: 'Inter', system-ui, sans-serif;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
