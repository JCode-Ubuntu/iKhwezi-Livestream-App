# Dynamically set Connection header:
#   - "upgrade" when the client sent an Upgrade header (WebSocket)
#   - "close"   for normal HTTP requests (polling, REST)
# Without this map, a hardcoded "Connection: upgrade" breaks Socket.IO's
# HTTP long-polling fallback and regular API calls through some proxies.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Dynamic map for HLS cache policy — must mirror the nginx-rtmp origin's map
# (nginx/nginx.conf.template). The proxy HIDES the upstream Cache-Control and
# emits its own single header: without proxy_hide_header the client would
# receive TWO Cache-Control headers (upstream's + this block's add_header),
# which is undefined-behaviour ambiguous caching across players/browsers.
#   .m3u8 playlists — no-cache (live window must always be current)
#   .ts segments    — 1h immutable: nginx-rtmp segment files are write-once
#                     (their bytes at a URL never change), so a warm cache is
#                     always correct — better than re-fetching from the VPS.
map $uri $hls_cache_control {
    ~\.m3u8$  "no-cache";
    default    "public, max-age=3600, immutable";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Socket.IO — handles both WebSocket upgrades AND HTTP long-polling
    location /socket.io/ {
        proxy_pass http://backend:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # LiveKit SFU (meeting A/V) — WebSocket signalling. The client's join
    # credential is minted by the backend after a membership check; this proxy
    # only forwards the upgrade to the SFU container. Media (RTP) flows
    # client ↔ SFU directly over UDP/TCP, never through nginx.
    #
    # URI rewriting: the client URL is wss://<site>/livekit → it dials
    # /livekit/rtc; the SFU wants /rtc, so the /livekit prefix is stripped.
    #
    # proxy_pass uses a VARIABLE + Docker's internal resolver so nginx boots
    # even when the SFU container is absent/stopped (optional infra —
    # presence-only meetings must never break the whole frontend container).
    # With a variable, nginx re-resolves per request instead of failing hard.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $livekit_upstream http://livekit:7880;
    location /livekit/ {
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass $livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # REST API — plain HTTP, no WebSocket headers needed
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    location /storage {
        proxy_pass http://backend:3001/storage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # HLS from nginx-rtmp (same origin as the SPA when using this container)
    location /hls/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        proxy_pass http://nginx-rtmp:8080/hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        # Single deterministic cache header (see map above); hide the origin's.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control $hls_cache_control always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    }
}
